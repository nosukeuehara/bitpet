name: Wasm

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build WebAssembly package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check wasm target
        run: cargo check --target wasm32-unknown-unknown --no-default-features --features wasm

      - name: Build wasm
        run: cargo build --release --target wasm32-unknown-unknown --no-default-features --features wasm

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Generate web bindings
        run: |
          mkdir -p dist/wasm
          wasm-bindgen target/wasm32-unknown-unknown/release/bitpet.wasm \
            --out-dir dist/wasm \
            --target web

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitpet-wasm
          path: dist/wasm
          if-no-files-found: error
