[package]
name = "bitpet"
version = "0.1.0"
edition = "2021"
description = "A small CLI digital pet."
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "bitpet"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = { version = "0.2", optional = true }
